server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1G;
    client_body_timeout 600s;

    # O index.html nunca pode ficar em cache. Ele referencia bundles com hash no
    # nome; se um cliente reaproveitar um index.html antigo depois de um deploy,
    # ele pede assets que nao existem mais e recebe 404 (a aplicacao nao carrega).
    # Antes este arquivo saia sem nenhum Cache-Control, deixando o navegador
    # aplicar cache heuristico em cima do Last-Modified.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Configuração para SPA (Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ^~ impede que o bloco regex de assets abaixo capture caminhos proxiados
    # que por acaso terminem em .js/.css/.json.
    location ^~ /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /python-api/ {
        # Bloco legado removido: Tendências SRAG usa GET /trends do backend FastAPI via /api/.
        return 410;
    }

    # Cache para arquivos estáticos. O Vite versiona estes arquivos pelo hash no
    # nome, entao sao imutaveis de fato. Um unico header Cache-Control: a versao
    # anterior usava "expires" e "add_header Cache-Control" juntos, o que emitia
    # o header duplicado na resposta.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Compressão gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/x-javascript
        application/xml+rss
        application/javascript
        application/json;
}
