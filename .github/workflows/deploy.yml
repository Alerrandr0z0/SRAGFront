name: Build, Push and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/devandrelima/arbovirosesfront

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            REACT_APP_API_URL=/api
            REACT_APP_PYTHON_API_URL=/python-api
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /root/arboviroses/ArbovirosesBack

            # A cópia do frontend é publicada no namespace devandrelima.
            # Mantém o compose da VPS apontando para a imagem recém-publicada.
            sed -i 's#ghcr.io/kaio05/arbovirosesfront:latest#ghcr.io/devandrelima/arbovirosesfront:latest#g' docker-compose.yml

            docker compose pull frontend
            docker compose up -d frontend --no-deps

            # Antes o deploy terminava aqui, sem verificar nada. Se o container
            # subisse quebrado — o nginx encerra com "host not found in upstream"
            # quando o backend nao esta de pe — o job ficava verde com a producao
            # fora do ar. Agora o deploy falha alto e mostra o log.
            PORT=$(grep -E '^PUBLIC_PORT=' .env.docker 2>/dev/null | cut -d= -f2 || true)
            PORT=${PORT:-8080}

            for _ in $(seq 1 30); do
              if curl -fsS -o /dev/null "http://localhost:${PORT}/"; then
                echo "OK: frontend respondendo na porta ${PORT}"
                exit 0
              fi
              sleep 2
            done

            echo "ERRO: frontend nao respondeu em 60s apos o deploy" >&2
            docker compose ps frontend >&2
            docker compose logs --tail=50 frontend >&2
            exit 1
